# 배포 — GitHub Actions (리눅스 러너)
#
# OpenNext 는 Windows 빌드를 지원하지 않아 로컬(Windows)에서 sst deploy 하면
# 서버 번들에 node_modules 가 빠진다 (Lambda: "Cannot find package 'next'").
# 그래서 배포는 여기(리눅스)에서 한다. 실행: GitHub → Actions → deploy →
# Run workflow → 브랜치 선택 → stage 선택.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  - petlife IAM 사용자 액세스 키
#   ENV_DEPLOY_DEV                             - 로컬 .env.deploy.dev 파일 내용 전체
#   ENV_DEPLOY_PROD                            - (운영 배포 시) .env.deploy.prod 내용 전체
name: deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "배포 스테이지"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-2
      SST_TELEMETRY_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: pnpm (corepack)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck + tests
        run: |
          pnpm -r typecheck
          pnpm -r test

      - name: Write stage env file
        env:
          # 스테이지별 시크릿을 각각 넘긴다. 표현식 하나로 고르면(a && b || c)
          # prod 시크릿이 비었을 때 dev 값으로 대체돼 운영이 dev DB 를 보게 된다.
          ENV_DEPLOY_DEV: ${{ secrets.ENV_DEPLOY_DEV }}
          ENV_DEPLOY_PROD: ${{ secrets.ENV_DEPLOY_PROD }}
          STAGE: ${{ inputs.stage }}
        run: |
          if [ "$STAGE" = "prod" ]; then ENV_FILE="$ENV_DEPLOY_PROD"; else ENV_FILE="$ENV_DEPLOY_DEV"; fi
          FILE=".env.deploy.$STAGE"
          printf '%s\n' "$ENV_FILE" > "$FILE"
          # 시크릿 미설정이면 여기서 바로 실패시킨다 (대체 없음)
          grep -q '^DATABASE_URL=' "$FILE" || {
            echo "Secret ENV_DEPLOY_$(echo "$STAGE" | tr a-z A-Z) is missing or has no DATABASE_URL." >&2
            echo "Register it: repo Settings -> Secrets and variables -> Actions." >&2
            exit 1; }
          # 운영에 dev 데이터베이스를 물리는 사고를 막는다
          if [ "$STAGE" = "prod" ] && grep -q '^DATABASE_URL=.*/app_dev' "$FILE"; then
            echo "ENV_DEPLOY_PROD points at the app_dev database - paste .env.deploy.prod, not .env.deploy.dev." >&2
            exit 1
          fi

      - name: Migrate + base seed
        run: |
          export DATABASE_URL="$(grep -m1 '^DATABASE_URL=' ".env.deploy.${{ inputs.stage }}" | cut -d= -f2-)"
          pnpm --filter @app/data db:migrate
          pnpm --filter @app/data seed:base

      - name: sst deploy
        run: pnpm exec sst deploy --stage ${{ inputs.stage }}
